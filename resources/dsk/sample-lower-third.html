<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
  <title>ffMix Broadcast Lower Third</title>
  <meta name="dsk-description" content="Glassmorphic broadcast lower-third with kinetic bar wipe In/Out animation" />
  <style>
    :root {
      --accent: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.45);
      --bg: rgba(15, 23, 42, 0.88);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --subtext: #cbd5e1;
      --in-progress: 0;
      --out-progress: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
    }

    .dsk-stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .lower-third {
      position: absolute;
      left: 88px;
      bottom: 84px;
      display: flex;
      align-items: stretch;
      gap: 0;
      transform-origin: left center;
      will-change: transform, opacity;
    }

    .accent-pillar {
      width: 10px;
      border-radius: 6px 0 0 6px;
      background: linear-gradient(180deg, var(--accent), #3b82f6);
      box-shadow: 0 0 24px var(--accent-glow);
      transform-origin: bottom center;
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: none;
      border-radius: 0 14px 14px 0;
      padding: 18px 34px 18px 26px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      min-width: 460px;
      max-width: 1080px;
      overflow: hidden;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .title {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.15;
      color: var(--text);
      white-space: nowrap;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 500;
      color: var(--subtext);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="dsk-stage">
    <div class="lower-third" id="lt">
      <div class="accent-pillar" id="pillar"></div>
      <div class="card" id="card">
        <div class="eyebrow" id="eyebrow">LIVE • FFMIX DSK</div>
        <div class="title" id="title">ffMix Live Broadcast</div>
        <div class="subtitle" id="subtitle">Normalized 1080p30 Feed • Studio A</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const titleText = params.get('title') || 'ffMix Live Broadcast';
      const subtitleText = params.get('subtitle') || 'Normalized 1080p30 Feed • Studio A';
      const eyebrowText = params.get('eyebrow') || 'LIVE • FFMIX DSK';
      const accentColor = params.get('accent') || '#06b6d4';
      const totalDuration = Math.max(2.0, parseFloat(params.get('duration') || '6.0'));

      document.getElementById('title').textContent = titleText;
      document.getElementById('subtitle').textContent = subtitleText;
      document.getElementById('eyebrow').textContent = eyebrowText;
      document.documentElement.style.setProperty('--accent', accentColor);

      const lt = document.getElementById('lt');
      const pillar = document.getElementById('pillar');
      const card = document.getElementById('card');

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
      }

      function easeInCubic(x) {
        const t = Math.min(1, Math.max(0, x));
        return t * t * t;
      }

      /**
       * Deterministic frame renderer called by ffMix DSK capture or browser RAF loop.
       * Handles smooth IN (0 -> 0.75s), HOLD, and OUT (duration-0.75s -> duration).
       */
      window.ffmixSeek = function (t) {
        const inDur = 0.75;
        const outDur = 0.75;
        const outStart = Math.max(inDur, totalDuration - outDur);

        let opacity = 1;
        let slideX = 0;
        let pillarScaleY = 1;
        let cardClip = 0;

        if (t < inDur) {
          const p = easeOutCubic(t / inDur);
          pillarScaleY = Math.min(1, p * 1.4);
          const cardP = easeOutCubic(Math.max(0, (t - 0.12) / (inDur - 0.12)));
          slideX = (1 - cardP) * -70;
          cardClip = (1 - cardP) * 100;
          opacity = Math.min(1, p * 1.3);
        } else if (t >= outStart) {
          const p = easeInCubic((t - outStart) / outDur);
          slideX = p * -90;
          cardClip = p * 100;
          pillarScaleY = Math.max(0, 1 - p * 1.15);
          opacity = Math.max(0, 1 - p);
        }

        lt.style.opacity = opacity.toFixed(4);
        lt.style.transform = `translate3d(${slideX.toFixed(2)}px, 0, 0)`;
        pillar.style.transform = `scaleY(${pillarScaleY.toFixed(4)})`;
        card.style.clipPath = `inset(0 ${cardClip.toFixed(2)}% 0 0)`;
      };

      // Initialize at t=0, or auto-play in interactive browser preview
      window.ffmixSeek(0);
      if (!params.has('manual')) {
        const start = performance.now();
        function loop(now) {
          const elapsed = ((now - start) / 1000) % (totalDuration + 1.0);
          window.ffmixSeek(Math.min(elapsed, totalDuration));
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      }
    })();
  </script>
</body>
</html>
